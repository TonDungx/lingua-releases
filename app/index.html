<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    Replaced by `flutter build web --base-href /<repo>/`. Must start and end
    with a slash; GitHub Pages serves the app under /lingua-releases/.
  -->
  <base href="/lingua-releases/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Lingua — học tiếng Anh (CEFR), tiếng Trung giản thể (HSK) và phồn thể (TOCFL). Chạy ngoại tuyến, không cần tài khoản mạng.">
  <meta name="theme-color" content="#6C5CE7">

  <!-- Link preview (Zalo, Messenger, Facebook, X). Absolute URLs on purpose:
       crawlers do not resolve <base href>. thumbnail.png is generated by
       test/thumbnail_generator_test.dart and copied from web/ by the build. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lingua">
  <meta property="og:title" content="Lingua — Học tiếng Anh và tiếng Trung, 12 từ mỗi ngày">
  <meta property="og:description" content="HSK, TOCFL, CEFR. Luyện viết từng nét, ôn tập ngắt quãng, dùng ngoại tuyến trên Android, Windows và iPhone.">
  <meta property="og:url" content="https://tondungx.github.io/lingua-releases/">
  <meta property="og:image" content="https://tondungx.github.io/lingua-releases/thumbnail.png">
  <meta property="og:image:width" content="2048">
  <meta property="og:image:height" content="1000">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tondungx.github.io/lingua-releases/thumbnail.png">

  <!-- iOS: "Thêm vào MH chính" turns the tab into a full-screen app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lingua">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Lingua</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F6F6FB; }
    @media (prefers-color-scheme: dark) { html, body { background: #14141C; } }
    /* Shown until Flutter paints its first frame, then removed below. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #7A7A93;
    }
    #splash img { width: 92px; height: 92px; border-radius: 26px;
      box-shadow: 0 12px 28px rgba(60, 50, 130, .18); }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px;
      background: rgba(108, 92, 231, .18); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: #6C5CE7; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <div>Đang tải Lingua…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
    // Offline support. sw.js is written by tools/release/build_web.mjs, so a
    // plain `flutter run -d chrome` has none and this quietly fails (404).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register(new URL('sw.js', document.baseURI).href)
          .catch(function (e) { console.warn('Service worker not registered:', e); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
